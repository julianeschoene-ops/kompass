name: Tägliche Kindernachrichten
on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update-kids-news.py
      - name: Nachrichten veröffentlichen
        run: |
          git config user.name "kompass-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily-kids-news.json
          if ! git diff --cached --quiet; then git commit -m "Update verified children's news"; git push; fi
